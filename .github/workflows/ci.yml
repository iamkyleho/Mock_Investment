name: Check and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test simulation rules
        run: npm test
